<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>土地家屋調査士 勉強記録</title><style>body {  font-family: sans-serif;  padding: 20px;  background: #f5f5f5;}h1 {  font-size: 22px;}h2 {  margin-top: 25px;}input {  width: 60px;  padding: 8px;  margin: 5px;}button {  padding: 10px 15px;  margin-top: 10px;}.box {  background: white;  padding: 15px;  margin-top: 15px;  border-radius: 10px;}.progress-bg {  width: 100%;  height: 25px;  background: #ddd;  border-radius: 15px;  overflow: hidden;  margin-top: 10px;}.progress-bar {  height: 100%;  width: 0%;  background: #4caf50;}.bar {  height: 30px;  margin: 8px 0;  background: #ddd;  border-radius: 5px;  overflow: hidden;}.bar-inner {  height: 100%;  width: 0%;  background: #777;}.history {  border-bottom: 1px solid #ddd;  padding: 8px 0;}</style></head><body><h1>📚 土地家屋調査士 勉強記録</h1><div class="box">  <h2>今日の勉強時間</h2>  択一：  <input type="number" id="takuitu" min="0" value="0"> 分<br>  記述：  <input type="number" id="kijutsu" min="0" value="0"> 分<br>  作図：  <input type="number" id="sakuzu" min="0" value="0"> 分<br>  <button onclick="saveStudy()">記録する</button></div><div class="box">  <h2>📊 今日の合計</h2>  <p id="todayTotal">0時間</p></div><div class="box">  <h2>🎯 今週の目標</h2>  目標：  <input type="number" id="weeklyGoal" min="1" value="10">  時間  <br>  <button onclick="saveGoal()">目標を設定</button>  <p id="weeklyGoalText"></p>  <div class="progress-bg">    <div class="progress-bar" id="progressBar"></div>  </div>  <p id="progressPercent"></p></div><div class="box">  <h2>🔥 連続勉強日数</h2>  <p id="streak">0日</p></div><div class="box">  <h2>📅 今週の勉強時間</h2>  <p id="weeklyTotal"></p></div><div class="box">  <h2>📈 今週の内容</h2>  <p>択一</p>  <div class="bar">    <div class="bar-inner" id="barTakuitu"></div>  </div>  <p>記述</p>  <div class="bar">    <div class="bar-inner" id="barKijutsu"></div>  </div>  <p>作図</p>  <div class="bar">    <div class="bar-inner" id="barSakuzu"></div>  </div></div><div class="box">  <h2>📝 勉強記録</h2>  <div id="history"></div></div><script>function getRecords() {  return JSON.parse(    localStorage.getItem("studyRecords") || "[]"  );}// 勉強時間を記録function saveStudy() {  const takuitu =    Number(document.getElementById("takuitu").value);  const kijutsu =    Number(document.getElementById("kijutsu").value);  const sakuzu =    Number(document.getElementById("sakuzu").value);  const total =    takuitu + kijutsu + sakuzu;  const today =    new Date().toISOString().slice(0,10);  const records = getRecords();  records.push({    date: today,    takuitu: takuitu,    kijutsu: kijutsu,    sakuzu: sakuzu,    total: total  });  localStorage.setItem(    "studyRecords",    JSON.stringify(records)  );  showTotal();  showWeekly();  showChart();  showHistory();  showStreak();  alert("勉強時間を記録しました！📚");}// 今日の合計function showTotal() {  const today =    new Date().toISOString().slice(0,10);  const records = getRecords();  let total = 0;  records.forEach(record => {    if(record.date === today) {      total += record.total;    }  });  document.getElementById("todayTotal").textContent =    formatTime(total);}// 今週の記録function getThisWeekRecords() {  const records = getRecords();  const now = new Date();  const day = now.getDay();  const diff =    day === 0 ? -6 : 1 - day;  const monday = new Date(now);  monday.setDate(    now.getDate() + diff  );  monday.setHours(0,0,0,0);  return records.filter(record => {    const date = new Date(record.date);    return date >= monday;  });}// 今週の合計function showWeekly() {  const records =    getThisWeekRecords();  let total = 0;  records.forEach(record => {    total += record.total;  });  document.getElementById("weeklyTotal").textContent =    "今週の勉強時間：" + formatTime(total);  showGoal(total);}// 目標を保存function saveGoal() {  const goal =    Number(      document.getElementById("weeklyGoal").value    );  if(goal <= 0) {    alert("1時間以上を入力してください");    return;  }  localStorage.setItem(    "weeklyGoalHours",    goal  );  showWeekly();  alert("今週の目標を設定しました！🎯");}// 目標を表示function showGoal(totalMinutes) {  let goalHours =    Number(      localStorage.getItem("weeklyGoalHours")    );  if(!goalHours) {    goalHours = 10;  }  document.getElementById("weeklyGoal").value =    goalHours;  const goalMinutes =    goalHours * 60;  const percent =    Math.round(      (totalMinutes / goalMinutes) * 100    );  document.getElementById("weeklyGoalText").textContent =    "今週の勉強時間：" +    formatTime(totalMinutes) +    " / " +    goalHours +    "時間";  document.getElementById("progressPercent").textContent =    "達成率：" + percent + "%";  const width =    Math.min(percent, 100);  document.getElementById("progressBar").style.width =    width + "%";}// 🔥 連続勉強日数function showStreak() {  const records = getRecords();  // 勉強した日だけ取り出す  const dates = [    ...new Set(      records        .filter(record => record.total > 0)        .map(record => record.date)    )  ];  dates.sort();  let streak = 0;  const today = new Date();  today.setHours(0,0,0,0);  // 今日の日付を確認  const todayString =    today.toISOString().slice(0,10);  // 今日勉強していなければ、  // 昨日から連続しているかを確認  let checkDate = new Date(today);  if(!dates.includes(todayString)) {    checkDate.setDate(      checkDate.getDate() - 1    );  }  while(true) {    const dateString =      checkDate.toISOString().slice(0,10);    if(dates.includes(dateString)) {      streak++;      checkDate.setDate(        checkDate.getDate() - 1      );    } else {      break;    }  }  document.getElementById("streak").textContent =    streak + "日";}// グラフfunction showChart() {  const records =    getThisWeekRecords();  let takuitu = 0;  let kijutsu = 0;  let sakuzu = 0;  records.forEach(record => {    takuitu += record.takuitu;    kijutsu += record.kijutsu;    sakuzu += record.sakuzu;  });  const max =    Math.max(      takuitu,      kijutsu,      sakuzu,      1    );  document.getElementById("barTakuitu").style.width =    (takuitu / max * 100) + "%";  document.getElementById("barKijutsu").style.width =    (kijutsu / max * 100) + "%";  document.getElementById("barSakuzu").style.width =    (sakuzu / max * 100) + "%";}// 時間表示function formatTime(minutes) {  const hours =    Math.floor(minutes / 60);  const mins =    minutes % 60;  if(hours === 0) {    return mins + "分";  }  if(mins === 0) {    return hours + "時間";  }  return hours + "時間" +         mins + "分";}// 履歴function showHistory() {  const records =    getRecords();  const history =    document.getElementById("history");  history.innerHTML = "";  records    .slice()    .reverse()    .forEach(record => {      const div =        document.createElement("div");      div.className = "history";      div.textContent =        record.date +        "　" +        formatTime(record.total) +        "（択一 " +        record.takuitu +        "分・記述 " +        record.kijutsu +        "分・作図 " +        record.sakuzu +        "分）";      history.appendChild(div);    });}// 起動時showTotal();showWeekly();showChart();showHistory();showStreak();</script></body></html>
